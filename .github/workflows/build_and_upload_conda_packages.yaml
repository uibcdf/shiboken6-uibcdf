name: Register Qt 6.10.1 staging dispatch

# GitHub requires workflow_dispatch on the default branch. The candidate
# branch contains the real build; this branch must never upload.
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact candidate commit
        required: true
        type: string
      python_version:
        description: Python minor for the candidate binding
        required: true
        type: choice
        options: ["3.11", "3.12", "3.13", "3.14"]

permissions:
  contents: read

jobs:
  candidate_branch_required:
    runs-on: ubuntu-latest
    steps:
      - name: Reject execution from the 6.9.2 branch
        run: |
          echo "::error::Dispatch with --ref python-3.14-qt-6.10.1"
          exit 1
