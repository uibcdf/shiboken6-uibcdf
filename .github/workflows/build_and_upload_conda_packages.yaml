name: Build and upload conda packages

# Requires a self-hosted runner on a Linux machine with enough RAM (~32 GB)
# and CPU cores for the PySide6/Qt source build (~40 min with 14 cores).
# Register a runner at:
#   github.com/uibcdf/shiboken6-uibcdf → Settings → Actions → Runners
# Or use an organization-level runner shared across all *-uibcdf stack repos.

on:
  release:
    types: ['released', 'prereleased']

  workflow_dispatch:

jobs:
  conda_deployment_with_new_tag:
    name: Conda deployment of package with Python ${{ matrix.python-version }}
    runs-on: [self-hosted, linux]
    env:
      RELEASE_VERSION: ${{ github.event.release.tag_name }}
      CPU_COUNT: "14"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup conda env
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: devtools/conda-envs/build_env.yaml
          environment-name: build
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=${{ matrix.python-version }}

      - name: Build and upload the conda packages
        uses: uibcdf/action-build-and-upload-conda-packages@main
        with:
          meta_yaml_dir: devtools/conda-build
          mambabuild: false
          user: uibcdf
          label: main
          conda_build_args: --package-format conda
          platform_linux-64: true
          platform_osx-64: false
          platform_osx-arm64: false
          platform_win-64: false
          token: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}
